<script>
"use strict";

/* =========================================================
   UTIL
========================================================= */

const $ = id => document.getElementById(id);

let selectedFile = null;

function randomInt(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}

function randomIdentifier(){
 const chars="IlOoXxZzVvQqAaBbCcDdEeFf";
 let s="_";
 for(let i=0;i<randomInt(12,24);i++){
  s+=chars[randomInt(0,chars.length-1)];
 }
 return s;
}

function hex(n){
 return n.toString(16).padStart(2,"0");
}

function shuffleArray(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=randomInt(0,i);
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

/* =========================================================
   ACTIVATION
========================================================= */

$("btnActivate").onclick=function(){

 const activation=$("activation");
 const card=$("card");

 activation.classList.add("hidden");

 setTimeout(()=>{
  activation.style.display="none";
  card.classList.add("active");
 },800);
};

/* =========================================================
   FILE
========================================================= */

$("picker").addEventListener("change",function(){

 selectedFile=this.files&&this.files.length
  ?this.files[0]
  :null;

 showFile();
});

function showFile(){
 $("fileName").textContent=
  selectedFile?selectedFile.name:"—";
}

/* =========================================================
   LUA LEXER
========================================================= */

function lexLua(source){

 const tokens=[];
 let i=0;

 function add(type,value){
  tokens.push({type,value});
 }

 while(i<source.length){

  const c=source[i];

  /* whitespace */

  if(/\s/.test(c)){

   let j=i+1;

   while(j<source.length&&/\s/.test(source[j]))j++;

   add("space",source.slice(i,j));
   i=j;
   continue;
  }

  /* comments */

  if(c==="-"&&source[i+1]==="-"){

   if(
    source[i+2]==="["&&
    source[i+3]==="["
   ){

    const end=source.indexOf("]]",i+4);

    if(end!==-1){

     add(
      "comment",
      source.slice(i,end+2)
     );

     i=end+2;
     continue;
    }
   }

   let j=source.indexOf("\n",i+2);

   if(j===-1)j=source.length;

   add("comment",source.slice(i,j));

   i=j;
   continue;
  }

  /* quoted strings */

  if(c==="'"||c==='"'){

   const quote=c;
   let j=i+1;

   while(j<source.length){

    if(source[j]==="\\"){
     j+=2;
     continue;
    }

    if(source[j]===quote){
     j++;
     break;
    }

    j++;
   }

   add("string",source.slice(i,j));

   i=j;
   continue;
  }

  /* long string */

  if(c==="["&&source[i+1]==="["){

   const end=source.indexOf("]]",i+2);

   if(end!==-1){

    add(
     "string",
     source.slice(i,end+2)
    );

    i=end+2;
    continue;
   }
  }

  /* identifier */

  if(/[A-Za-z_]/.test(c)){

   let j=i+1;

   while(
    j<source.length&&
    /[A-Za-z0-9_]/.test(source[j])
   )j++;

   add(
    "identifier",
    source.slice(i,j)
   );

   i=j;
   continue;
  }

  /* number */

  if(/[0-9]/.test(c)){

   let j=i+1;

   while(
    j<source.length&&
    /[A-Za-z0-9_.]/.test(source[j])
   )j++;

   add(
    "number",
    source.slice(i,j)
   );

   i=j;
   continue;
  }

  /* operators */

  const op3=source.slice(i,i+3);

  if(
   ["...","<<=",">>="].includes(op3)
  ){

   add("symbol",op3);
   i+=3;
   continue;
  }

  const op2=source.slice(i,i+2);

  if(
   [
    "==","~=","<=",">=",
    "..","//","<<",">>",
    "+=","-=","*=","/=","%=",
    "::"
   ].includes(op2)
  ){

   add("symbol",op2);
   i+=2;
   continue;
  }

  add("symbol",c);
  i++;
 }

 return tokens;
}

/* =========================================================
   STRING DECODER
========================================================= */

function decodeLuaString(raw){

 if(raw.startsWith("[[")&&raw.endsWith("]]")){
  return raw.slice(2,-2);
 }

 let value=raw.slice(1,-1);

 value=value.replace(
  /\\([\\'"nrtbfv])/g,
  (_,c)=>{

   const map={
    "\\":"\\",
    "'":"'",
    '"':'"',
    n:"\n",
    r:"\r",
    t:"\t",
    b:"\b",
    f:"\f",
    v:"\v"
   };

   return map[c]??c;
  }
 );

 value=value.replace(
  /\\([0-9]{1,3})/g,
  (_,n)=>String.fromCharCode(parseInt(n,10))
 );

 return value;
}

/* =========================================================
   STRING VM ENCODER
========================================================= */

function encodeStringVM(raw){

 const value=decodeLuaString(raw);

 const arr=[];

 for(let i=0;i<value.length;i++){
  arr.push(value.charCodeAt(i));
 }

 if(!arr.length)return '""';

 /*
   Setiap byte diberi operasi sederhana.
   Hasil runtime tetap menghasilkan string asli.
 */

 const parts=arr.map(code=>{

  const mode=randomInt(0,3);

  if(mode===0){
   return `((${code}+0))`;
  }

  if(mode===1){
   const a=randomInt(1,20);
   return `((${code+a}-${a}))`;
  }

  if(mode===2){
   const a=randomInt(2,9);
   return `((${code*a}/${a}))`;
  }

  const a=randomInt(1,10);
  const b=code+a;

  return `((${b}-${a}))`;
 });

 return `_S({${parts.join(",")}})`;
}

/* =========================================================
   NUMBER ENCODER
========================================================= */

function encodeNumber(raw){

 const n=Number(raw);

 if(
  !Number.isFinite(n)||
  raw.includes(".")||
  raw.includes("e")||
  raw.includes("E")||
  Math.abs(n)<2||
  Math.abs(n)>10000
 ){
  return raw;
 }

 if(!Number.isInteger(n))return raw;

 const type=randomInt(0,4);

 if(type===0){

  const a=randomInt(1,Math.max(1,Math.abs(n)));

  return n>=0
   ?`(${n+a}-${a})`
   :`(${n-a}+${a})`;
 }

 if(type===1){

  const a=randomInt(2,9);

  if(n%a===0){
   return `(${n*a}/${a})`;
  }

  return `(${n+10}-10)`;
 }

 if(type===2){

  const a=Math.floor(n/2);
  const b=n-a;

  return `(${a}+${b})`;
 }

 if(type===3){

  const a=randomInt(2,30);

  return `(${n+a}-${a})`;
 }

 return `(${n})`;
}

/* =========================================================
   LUA RESERVED
========================================================= */

const RESERVED=new Set([
 "and","break","do","else","elseif","end",
 "false","for","function","goto","if","in",
 "local","nil","not","or","repeat","return",
 "then","true","until","while"
]);

const GLOBALS=new Set([
 "_G","_ENV","self",
 "assert","collectgarbage","dofile","error",
 "getmetatable","ipairs","load","loadfile",
 "next","pairs","pcall","print","rawequal",
 "rawget","rawlen","rawset","require",
 "select","setmetatable","tonumber",
 "tostring","type","xpcall",
 "coroutine","debug","io","math","os",
 "package","string","table","utf8"
]);

/* =========================================================
   SAFE LOCAL RENAMER
========================================================= */

function renameLocals(tokens){

 const map=new Map();
 const used=new Set();

 function make(){

  let n;

  do{
   n=randomIdentifier();
  }while(used.has(n));

  used.add(n);
  return n;
 }

 function declare(name){

  if(
   RESERVED.has(name)||
   GLOBALS.has(name)
  )return name;

  if(!map.has(name)){
   map.set(name,make());
  }

  return map.get(name);
 }

 /*
   Hanya rename identifier setelah "local".
   Ini sengaja lebih konservatif supaya
   properti/table field tidak ikut rusak.
 */

 for(let i=0;i<tokens.length;i++){

  const t=tokens[i];

  if(
   t.type==="identifier"&&
   t.value==="local"
  ){

   let j=i+1;

   if(
    tokens[j]&&
    tokens[j].type==="identifier"&&
    tokens[j].value==="function"
   ){

    j++;

    if(
     tokens[j]&&
     tokens[j].type==="identifier"
    ){

     tokens[j].value=declare(tokens[j].value);
    }

    continue;
   }

   while(j<tokens.length){

    const x=tokens[j];

    if(
     x.type==="identifier"
    ){

     x.value=declare(x.value);
     j++;
     continue;
    }

    if(x.value===","){
     j++;
     continue;
    }

    break;
   }
  }
 }

 /*
   Ganti referensi yang cocok.
 */

 for(const t of tokens){

  if(t.type!=="identifier")continue;

  if(
   RESERVED.has(t.value)||
   GLOBALS.has(t.value)
  )continue;

  const old=t.value;

  if(map.has(old)){
   t.value=map.get(old);
  }
 }

 return tokens;
}

/* =========================================================
   REMOVE SPACES
========================================================= */

function minifyLuaTokens(tokens){

 let out="";

 for(let i=0;i<tokens.length;i++){

  const t=tokens[i];

  if(t.type==="space"){

   const p=tokens[i-1];
   const n=tokens[i+1];

   if(
    p&&n&&
    (
     (
      (p.type==="identifier"||p.type==="number")&&
      (n.type==="identifier"||n.type==="number")
     )
    )
   ){
    out+=" ";
   }

   continue;
  }

  out+=t.value;
 }

 return out.trim();
}

/* =========================================================
   VM OPCODES
========================================================= */

const OPCODES={
 NOP:11,
 STR:23,
 NUM:37,
 RAW:41,
 END:59
};

function opEncode(n){

 const salt=randomInt(11,97);

 return {
  a:n^salt,
  b:salt
 };
}

/* =========================================================
   VM BUILDER
========================================================= */

function buildVM(source){

 /*
   Kita bungkus source sebagai RAW instruction.
   Runtime dispatcher menjalankan instruction
   berdasarkan opcode terenkripsi.

   Ini adalah VM-style layer, bukan interpreter
   penuh untuk seluruh bahasa Lua.
 */

 const vmName=randomIdentifier();
 const tableName=randomIdentifier();
 const pcName=randomIdentifier();
 const instrName=randomIdentifier();
 const decodeName=randomIdentifier();
 const execName=randomIdentifier();
 const strName=randomIdentifier();

 const salt=randomInt(31,127);

 const rawBytes=[];

 for(let i=0;i<source.length;i++){
  rawBytes.push(
   source.charCodeAt(i)^salt
  );
 }

 const encodedOpcode=OPCODES.RAW^salt;

 const junk=[];

 const junkCount=randomInt(5,12);

 for(let i=0;i<junkCount;i++){

  const n=opEncode(OPCODES.NOP);

  junk.push(
   `{${n.a},${n.b},0}`
  );
 }

 const instructionList=[
  ...junk,
  `{${encodedOpcode},${salt},{${rawBytes.join(",")}}}`,
  `{${OPCODES.END^salt},${salt},0}`
 ];

 shuffleArray(instructionList);

 /*
   END harus dipastikan berada di akhir.
 */

 const endInstruction=
  `{${OPCODES.END^salt},${salt},0}`;

 const index=instructionList.indexOf(endInstruction);

 if(index!==-1){
  instructionList.splice(index,1);
 }

 instructionList.push(endInstruction);

 return `
local ${vmName}={}

local ${decodeName}=function(a,b)
    return a~b
end

local ${strName}=function(t,s)
    local r={}
    for i=1,#t do
        r[i]=string.char(${decodeName}(t[i],s))
    end
    return table.concat(r)
end

local ${execName}=function()
    local ${tableName}={
        ${instructionList.join(",")}
    }

    local ${pcName}=1

    while true do

        local ${instrName}=${tableName}[${pcName}]

        if not ${instrName} then
            break
        end

        local op=${instrName}[1]
        local s=${instrName}[2]
        local data=${instrName}[3]

        op=${decodeName}(op,s)

        if op==${OPCODES.NOP} then

            local _v=${randomInt(1,999)}
            _v=_v

        elseif op==${OPCODES.RAW} then

            local __src=${strName}(data,s)

            local __fn,___err=load(__src)

            if __fn then
                __fn()
            else
                error(___err)
            end

        elseif op==${OPCODES.END} then
            break
        end

        ${pcName}=${pcName}+1
    end
end

${execName}()
`;

}

/* =========================================================
   JUNK GENERATOR
========================================================= */

function junkLayer(){

 const a=randomIdentifier();
 const b=randomIdentifier();
 const c=randomIdentifier();

 const junk=[
  `do local ${a}=0 ${a}=${a}+1 end;`,
  `do local ${b}={};${b}[1]=nil end;`,
  `do local ${c}=string.len("") end;`,
  `do local _=math.floor(0.5) end;`,
  `do local _=math.abs(-1) end;`,
  `do local _=table.concat({}) end;`,
  `do local _=select(1,"x") end;`
 ];

 shuffleArray(junk);

 return junk.slice(
  0,
  randomInt(3,junk.length)
 ).join("");
}

/* =========================================================
   MAIN LUA PROCESSOR
========================================================= */

function processLua(source){

 let tokens=lexLua(source);

 if($("comments").checked){

  tokens=tokens.filter(
   t=>t.type!=="comment"
  );
 }

 if($("names").checked){
  tokens=renameLocals(tokens);
 }

 if($("strings").checked){

  for(const t of tokens){

   if(t.type==="string"){

    /*
      Jangan mengubah string kosong menjadi
      expression yang tidak diperlukan.
    */

    const decoded=decodeLuaString(t.value);

    if(decoded.length){
     t.value=encodeStringVM(t.value);
    }
   }
  }
 }

 if($("numbers").checked){

  for(const t of tokens){

   if(t.type==="number"){

    t.value=encodeNumber(t.value);
   }
  }
 }

 let result=minifyLuaTokens(tokens);

 /*
   Runtime helper untuk encoded strings.
 */

 if($("strings").checked){

  result=
   `local _S=function(t)local r={}for i=1,#t do r[i]=string.char(t[i])end return table.concat(r)end;`
   +result;
 }

 /*
   Tambahkan junk sebelum VM.
 */

 if($("junk").checked){
  result=junkLayer()+result;
 }

 /*
   VM STYLE
 */

 if($("vm").checked){

  result=buildVM(result);
 }

 /*
   Kalau VM tidak aktif,
   tetap bisa dibuat minified.
 */

 if($("minify").checked){

  result=result
   .replace(/\r?\n/g," ")
   .replace(/\s{2,}/g," ")
   .trim();
 }

 /*
   Header sengaja tetap terbaca.
 */

 return "-- BAIM OBFUSCATOR\n"+result;
}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(content,filename){

 const blob=new Blob(
  [content],
  {type:"text/plain;charset=utf-8"}
 );

 const url=URL.createObjectURL(blob);

 const link=document.createElement("a");

 link.href=url;
 link.download=filename;

 document.body.appendChild(link);

 link.click();

 link.remove();

 setTimeout(
  ()=>URL.revokeObjectURL(url),
  1500
 );
}

/* =========================================================
   OUTPUT NAME
========================================================= */

function outputName(filename){

 const dot=filename.lastIndexOf(".");

 if(dot===-1){
  return filename+"_BAIM_VM";
 }

 return (
  filename.slice(0,dot)+
  "_BAIM_VM"+
  filename.slice(dot)
 );
}

/* =========================================================
   START
========================================================= */

$("start").addEventListener(
 "click",
 async function(){

  if(!selectedFile){

   $("picker").click();
   return;
  }

  const button=this;

  button.classList.add("loading");

  $("status").textContent=
   "BAIM VM ENGINE PROCESSING...";

  try{

   const source=await selectedFile.text();

   if(!source.trim()){
    throw new Error("EMPTY_FILE");
   }

   await new Promise(
    resolve=>setTimeout(resolve,250)
   );

   const ext=
    selectedFile.name
    .toLowerCase()
    .split(".")
    .pop();

   if(ext!=="lua"&&ext!=="txt"){
    throw new Error("LUA_ONLY");
   }

   const result=processLua(source);

   downloadFile(
    result,
    outputName(selectedFile.name)
   );

   $("status").textContent=
    "BAIM VM OBFUSCATION COMPLETE";

  }catch(error){

   console.error(error);

   $("status").textContent=
    "PROCESS ERROR — SOURCE TIDAK COCOK";
  }

  button.classList.remove("loading");
 }
);

/* =========================================================
   DRAG DROP
========================================================= */

const drop=$("drop");

["dragenter","dragover"].forEach(name=>{

 drop.addEventListener(name,e=>{

  e.preventDefault();
  e.stopPropagation();

  drop.style.transform=
   "translateY(-4px) scale(1.01)";
 });
});

["dragleave","drop"].forEach(name=>{

 drop.addEventListener(name,e=>{

  e.preventDefault();
  e.stopPropagation();

  drop.style.transform="";
 });
});

drop.addEventListener("drop",e=>{

 const files=e.dataTransfer.files;

 if(!files||!files.length)return;

 const file=files[0];

 const ext=
  file.name.toLowerCase().split(".").pop();

 if(ext!=="lua"&&ext!=="txt"){
  $("status").textContent=
   "PILIH FILE LUA";
  return;
 }

 selectedFile=file;
 showFile();
});

</script>
