<script>
"use strict";

const $ = id => document.getElementById(id);

let selectedFile = null;

/* ========== LAYAR AKTIVASI ========== */
$("btnActivate").addEventListener("click", function(){

    const activation = $("activation");
    const card = $("card");

    // Tambahkan animasi keluar
    activation.classList.add("hidden");

    // Setelah transisi selesai, sembunyikan dan tampilkan card
    setTimeout(function(){
        activation.style.display = "none";
        card.classList.add("active");
    }, 800);
});

/* =========================================================
   RANDOM IDENTIFIER
========================================================= */

function randomIdentifier(){

    const chars =
        "IlOoXxZzVvQqAaBbCcDdEeFf";

    let result = "_";

    for(let i = 0; i < 20; i++){

        result += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];
    }

    return result;
}

function escapeRegExp(text){

    return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );
}

/* =========================================================
   FILE
========================================================= */

$("picker").addEventListener(
    "change",
    function(){

        selectedFile =
            this.files &&
            this.files.length
                ? this.files[0]
                : null;

        showFile();
    }
);

function showFile(){

    $("fileName").textContent =
        selectedFile
            ? selectedFile.name
            : "—";
}

/* =========================================================
   LUA LEXER
========================================================= */

function lexLua(source){

    const tokens = [];

    let i = 0;

    function push(type,value){
        tokens.push({
            type:type,
            value:value
        });
    }

    while(i < source.length){

        const c = source[i];

        if(/\s/.test(c)){

            let j = i + 1;

            while(
                j < source.length &&
                /\s/.test(source[j])
            ){
                j++;
            }

            push("space",source.slice(i,j));

            i = j;
            continue;
        }

        if(
            c === "-" &&
            source[i + 1] === "-"
        ){

            if(
                source[i + 2] === "[" &&
                source[i + 3] === "["
            ){

                const end =
                    source.indexOf(
                        "]]",
                        i + 4
                    );

                if(end !== -1){

                    push(
                        "comment",
                        source.slice(
                            i,
                            end + 2
                        )
                    );

                    i = end + 2;
                    continue;
                }
            }

            let j =
                source.indexOf(
                    "\n",
                    i + 2
                );

            if(j === -1)
                j = source.length;

            push(
                "comment",
                source.slice(i,j)
            );

            i = j;
            continue;
        }

        if(c === "'" || c === '"'){

            const quote = c;

            let j = i + 1;

            while(j < source.length){

                if(source[j] === "\\"){

                    j += 2;
                    continue;
                }

                if(source[j] === quote){

                    j++;
                    break;
                }

                j++;
            }

            push(
                "string",
                source.slice(i,j)
            );

            i = j;
            continue;
        }

        if(
            c === "[" &&
            source[i + 1] === "["
        ){

            const end =
                source.indexOf(
                    "]]",
                    i + 2
                );

            if(end !== -1){

                push(
                    "string",
                    source.slice(
                        i,
                        end + 2
                    )
                );

                i = end + 2;
                continue;
            }
        }

        if(
            /[A-Za-z_]/.test(c)
        ){

            let j = i + 1;

            while(
                j < source.length &&
                /[A-Za-z0-9_]/.test(
                    source[j]
                )
            ){
                j++;
            }

            push(
                "identifier",
                source.slice(i,j)
            );

            i = j;
            continue;
        }

        if(/[0-9]/.test(c)){

            let j = i + 1;

            while(
                j < source.length &&
                /[A-Za-z0-9_.]/.test(
                    source[j]
                )
            ){
                j++;
            }

            push(
                "number",
                source.slice(i,j)
            );

            i = j;
            continue;
        }

        let op =
            source.slice(i,i + 3);

        if(
            op === "..." ||
            op === ">>=" ||
            op === "<<="
        ){

            push("symbol",op);
            i += 3;
            continue;
        }

        op =
            source.slice(i,i + 2);

        if(
            [
                "==",
                "~=",
                "<=",
                ">=",
                "..",
                "//",
                "<<",
                ">>",
                "+=",
                "-=",
                "*=",
                "/=",
                "%="
            ].includes(op)
        ){

            push("symbol",op);
            i += 2;
            continue;
        }

        push("symbol",c);

        i++;
    }

    return tokens;
}

/* =========================================================
   LUA STRING ENCODER (LEVEL MAX)
========================================================= */

function decodeLuaString(raw){

    if(
        raw.startsWith("[[") &&
        raw.endsWith("]]")
    ){

        return raw.slice(2,-2);
    }

    let value = raw.slice(1,-1);

    value =
        value.replace(
            /\\([\\'"nrtbfv])/g,
            function(_,c){

                const map = {
                    "\\":"\\",
                    "'":"'",
                    '"':'"',
                    n:"\n",
                    r:"\r",
                    t:"\t",
                    b:"\b",
                    f:"\f",
                    v:"\v"
                };

                return map[c] ?? c;
            }
        );

    value =
        value.replace(
            /\\([0-9]{1,3})/g,
            function(_,n){
                return String.fromCharCode(
                    parseInt(n,10)
                );
            }
        );

    return value;
}

function obfuscateLuaString(raw){

    const value =
        decodeLuaString(raw);

    if(!value.length)
        return '""';

    const codes = [];

    for(
        let i = 0;
        i < value.length;
        i++
    ){

        codes.push(
            value.charCodeAt(i)
        );
    }

    const pieces = [];

    let i = 0;

    while(i < codes.length){

        const chunkSize =
            1 + Math.floor(
                Math.random() * 3
            );

        const chunk =
            codes.slice(
                i,
                i + chunkSize
            );

        if(chunk.length){

            pieces.push(
                "_d(" +
                chunk.join(",") +
                ")"
            );
        }

        i += chunkSize;
    }

    if(pieces.length === 1)
        return pieces[0];

    return "(" +
        pieces.join("..") +
        ")";
}

/* =========================================================
   LUA NUMBER OBFUSCATION (LEVEL MAX)
========================================================= */

function obfuscateLuaNumber(numStr){

    const num = Number(numStr);

    if(
        isNaN(num) ||
        !isFinite(num) ||
        numStr.includes(".") ||
        numStr.length > 4 ||
        Math.abs(num) < 2 ||
        Math.abs(num) > 10000
    ){
        return numStr;
    }

    const options = [];

    if(Number.isInteger(num)){

        const a = Math.floor(num/2);
        const b = num - a;
        const c = Math.ceil(num/3);
        const d = num % 3;

        options.push(
            `(${a}+${b})`,
            `(${a*2}+${b})`,
            `(${c*3}+${d})`,
            `(${c*3}-${3-d})`
        );

        if(num > 2 && num < 100){
            options.push(
                `(${num+10}-10)`,
                `(${num-7}+7)`,
                `(${num*5}/5)`
            );
        }

    } else {

        options.push(
            `(${num*2}/2)`,
            `(${num+1}-1)`,
            `(${num-1}+1)`
        );
    }

    return options[
        Math.floor(
            Math.random() * options.length
        )
    ];
}

/* =========================================================
   LUA RESERVED / GLOBAL
========================================================= */

const LUA_RESERVED = new Set([
    "and","break","do","else","elseif","end","false","for","function","goto",
    "if","in","local","nil","not","or","repeat","return","then","true","until","while"
]);

const LUA_GLOBALS = new Set([
    "_G","_ENV","self","assert","collectgarbage","dofile","error","getmetatable",
    "ipairs","load","loadfile","next","pairs","pcall","print","rawequal","rawget",
    "rawlen","rawset","require","select","setmetatable","tonumber","tostring","type",
    "xpcall","coroutine","debug","io","math","os","package","string","table","utf8"
]);

/* =========================================================
   LUA LOCAL RENAMER
========================================================= */

function obfuscateLuaLocals(tokens){

    const scopes = [new Map()];
    const used = new Set();

    function newName(){

        let name;

        do{
            name = randomIdentifier();
        }while(used.has(name));

        used.add(name);

        return name;
    }

    function find(name){

        for(let i = scopes.length - 1; i >= 0; i--){
            if(scopes[i].has(name)){
                return scopes[i].get(name);
            }
        }

        return null;
    }

    function declare(name){

        if(LUA_RESERVED.has(name) || LUA_GLOBALS.has(name)){
            return name;
        }

        if(scopes[scopes.length - 1].has(name)){
            return scopes[scopes.length - 1].get(name);
        }

        const n = newName();
        scopes[scopes.length - 1].set(name, n);
        return n;
    }

    for(let i = 0; i < tokens.length; i++){

        const token = tokens[i];

        if(token.type === "identifier" && token.value === "local"){

            let j = i + 1;

            if(tokens[j] && tokens[j].type === "identifier" && tokens[j].value === "function"){

                j++;
                if(tokens[j] && tokens[j].type === "identifier"){
                    tokens[j].value = declare(tokens[j].value);
                }
                continue;
            }

            while(j < tokens.length){

                const t = tokens[j];

                if(t.type === "identifier"){

                    t.value = declare(t.value);
                    j++;
                    continue;
                }

                if(t.value === ","){
                    j++;
                    continue;
                }

                break;
            }
        }
    }

    for(let i = 0; i < tokens.length; i++){

        if(tokens[i].type === "identifier" && tokens[i].value === "function"){

            let j = i + 1;

            while(j < tokens.length && tokens[j].value !== "("){
                j++;
            }

            if(j >= tokens.length) continue;

            let depth = 1;
            j++;

            scopes.push(new Map());

            while(j < tokens.length && depth > 0){

                if(tokens[j].value === "(") depth++;
                if(tokens[j].value === ")") depth--;

                if(depth === 1 && tokens[j].type === "identifier"){

                    const previous = tokens[j - 1];

                    if(!previous || previous.value !== "."){
                        tokens[j].value = declare(tokens[j].value);
                    }
                }

                j++;
            }

            scopes.pop();
        }
    }

    for(let i = 0; i < tokens.length; i++){

        const t = tokens[i];

        if(t.type !== "identifier") continue;

        if(LUA_RESERVED.has(t.value) || LUA_GLOBALS.has(t.value)) continue;

        const previous = tokens[i - 1];

        if(previous && (previous.value === "." || previous.value === ":")) continue;

        const mapped = find(t.value);

        if(mapped) t.value = mapped;
    }

    return tokens;
}

/* =========================================================
   LUA TOKENS -> SOURCE
========================================================= */

function tokensToLua(tokens){

    return tokens.map(t => t.value).join("");
}

/* =========================================================
   LUA MINIFIER
========================================================= */

function minifyLua(source){

    const tokens = lexLua(source);

    let result = "";

    for(let i = 0; i < tokens.length; i++){

        const t = tokens[i];

        if(t.type === "space"){

            const previous = tokens[i - 1];
            const next = tokens[i + 1];

            if(previous && next &&
                ((previous.type === "identifier" || previous.type === "number") &&
                 (next.type === "identifier" || next.type === "number"))){

                result += " ";
            }

            continue;
        }

        result += t.value;
    }

    return result.trim();
}

/* =========================================================
   LUA HEAVY JUNK INJECTION (LEVEL MAX)
========================================================= */

function heavyJunkInjection(source){

    const junkPool = [
        `do local _=math.random(1,100) end;`,
        `do local _=string.rep("a",0) end;`,
        `do local _={} _[1]=nil end;`,
        `do local _=tonumber("0") end;`,
        `do local _=#"" end;`,
        `do local _=type(nil) end;`,
        `do local _=pairs({}) end;`,
        `do local _=ipairs({}) end;`,
        `do local _=next({}) end;`,
        `do local _=select(1,"x") end;`,
        `do local _=math.floor(0.5) end;`,
        `do local _=math.ceil(0.5) end;`,
        `do local _=math.abs(-1) end;`,
        `do local _=string.len("") end;`,
        `do local _=table.concat({}) end;`
    ];

    let junk = "";
    const count = 8 + Math.floor(Math.random() * 15);

    for(let i=0; i<count; i++){
        junk += junkPool[Math.floor(Math.random() * junkPool.length)];
        if(Math.random() < 0.3) junk += " ";
    }

    return junk + source + junk;
}

/* =========================================================
   LUA FULL PROCESSOR (LEVEL MAX)
========================================================= */

function processLua(source){

    let tokens = lexLua(source);

    if($("comments").checked){
        tokens = tokens.filter(t => t.type !== "comment");
    }

    if($("strings").checked){

        for(let i = 0; i < tokens.length; i++){
            if(tokens[i].type === "string"){
                tokens[i].value = obfuscateLuaString(tokens[i].value);
                tokens[i].type = "generated";
            }
        }
    }

    if($("names").checked){
        tokens = obfuscateLuaLocals(tokens);
    }

    if($("numObf").checked){
        for(let i = 0; i < tokens.length; i++){
            if(tokens[i].type === "number"){
                tokens[i].value = obfuscateLuaNumber(tokens[i].value);
                tokens[i].type = "generated";
            }
        }
    }

    let result = tokensToLua(tokens);

    if($("strings").checked && result.includes("_d(")){
        result = "local _d=string.char;" + result;
    }

    if($("minify").checked){
        result = minifyLua(result);
    }

    if($("junk").checked){
        const dummy = randomIdentifier();
        result = "local " + dummy + "=nil;" + result;
    }

    if($("junkObf").checked){
        result = heavyJunkInjection(result);
    }

    /* Paksa satu baris */
    result = result.replace(/\r?\n/g, " ");

    return (
        "-- BAIM OBFUSCATOR\n" +
        result
    );
}

/* =========================================================
   PAWN COMMENT REMOVER
========================================================= */

function removePawnComments(source){

    let result = "";
    let i = 0;
    let inString = false;

    while(i < source.length){

        const c = source[i];

        if(c === '"' && source[i - 1] !== "\\"){

            inString = !inString;
            result += c;
            i++;
            continue;
        }

        if(!inString && c === "/" && source[i + 1] === "/"){

            while(i < source.length && source[i] !== "\n"){
                i++;
            }
            result += "\n";
            continue;
        }

        if(!inString && c === "/" && source[i + 1] === "*"){

            const end = source.indexOf("*/", i + 2);
            if(end === -1) break;

            i = end + 2;
            result += "\n";
            continue;
        }

        result += c;
        i++;
    }

    return result;
}

/* =========================================================
   PAWN STRING ENCODER
========================================================= */

function encodePawnStrings(source){

    let result = "";
    let i = 0;

    while(i < source.length){

        if(source[i] !== '"'){
            result += source[i];
            i++;
            continue;
        }

        let j = i + 1;

        while(j < source.length){

            if(source[j] === "\\" && j + 1 < source.length){
                j += 2;
                continue;
            }

            if(source[j] === '"'){
                j++;
                break;
            }

            j++;
        }

        const raw = source.slice(i + 1, j - 1);

        let encoded = "";

        for(let k = 0; k < raw.length; k++){

            const code = raw.charCodeAt(k);
            encoded += "\\x" + code.toString(16).padStart(2, "0");
        }

        result += '"' + encoded + '"';

        i = j;
    }

    return result;
}

/* =========================================================
   PAWN MINIFY
========================================================= */

function minifyPawn(source){

    return source
        .replace(/\r\n/g, "\n")
        .replace(/[ \t]+/g, " ")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/\n{2,}/g, "\n")
        .trim();
}

/* =========================================================
   PAWN PROCESSOR
========================================================= */

function processPawn(source){

    if($("comments").checked){
        source = removePawnComments(source);
    }

    if($("strings").checked){
        source = encodePawnStrings(source);
    }

    if($("minify").checked){
        source = minifyPawn(source);
    }

    source = source.replace(/\r?\n/g, " ");

    return (
        "/* BAIM OBFUSCATOR */\n" +
        source
    );
}

/* =========================================================
   HTML PROCESSOR
========================================================= */

function removeHTMLComments(source){

    return source.replace(/<!--[\s\S]*?-->/g, "");
}

function minifyHTML(source){

    source = source.replace(/>\s+</g, "><");
    source = source.replace(/\s{2,}/g, " ");
    return source.trim();
}

function processHTML(source){

    if($("comments").checked){
        source = removeHTMLComments(source);
    }

    if($("minify").checked){
        source = minifyHTML(source);
    }

    source = source.replace(/\r?\n/g, " ");

    return (
        "<!-- BAIM OBFUSCATOR -->\n" +
        source
    );
}

/* =========================================================
   PROCESS
========================================================= */

function processSource(source, filename){

    const ext = filename.toLowerCase().split(".").pop();

    if(ext === "lua") return processLua(source);

    if(ext === "pwn" || ext === "inc" || ext === "txt"){
        return processPawn(source);
    }

    if(ext === "html" || ext === "htm"){
        return processHTML(source);
    }

    return source;
}

/* =========================================================
   OUTPUT NAME
========================================================= */

function outputName(filename){

    const dot = filename.lastIndexOf(".");

    if(dot === -1){
        return filename + "_BAIM_OBF";
    }

    return filename.slice(0, dot) + "_BAIM_OBF" + filename.slice(dot);
}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(content, filename, mime){

    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* =========================================================
   START
========================================================= */

$("start").addEventListener("click", async function(){

    if(!selectedFile){
        $("picker").click();
        return;
    }

    const button = this;
    button.classList.add("loading");
    $("status").textContent = "BAIM OBFUSCATOR";

    try{

        const source = await selectedFile.text();

        if(!source.trim()){
            throw new Error("EMPTY_FILE");
        }

        await new Promise(resolve => setTimeout(resolve, 300));

        const result = processSource(source, selectedFile.name);

        const ext = selectedFile.name.toLowerCase().split(".").pop();

        let mime = "text/plain";

        if(ext === "html" || ext === "htm"){
            mime = "text/html";
        }

        downloadFile(result, outputName(selectedFile.name), mime);

        $("card").classList.remove("success");
        void $("card").offsetWidth;
        $("card").classList.add("success");

        $("status").textContent = "BAIM OBFUSCATOR";

    }catch(error){

        console.error(error);
        $("status").textContent = "BAIM OBFUSCATOR";
    }

    button.classList.remove("loading");
});

/* =========================================================
   DRAG DROP
========================================================= */

const drop = $("drop");

["dragenter", "dragover"].forEach(eventName => {

    drop.addEventListener(eventName, event => {

        event.preventDefault();
        event.stopPropagation();

        drop.style.transform = "translateY(-4px) scale(1.01)";
    });
});

["dragleave", "drop"].forEach(eventName => {

    drop.addEventListener(eventName, event => {

        event.preventDefault();
        event.stopPropagation();

        drop.style.transform = "";
    });
});

drop.addEventListener("drop", event => {

    const files = event.dataTransfer.files;

    if(!files || !files.length){
        return;
    }

    selectedFile = files[0];
    showFile();
});
